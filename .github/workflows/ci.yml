name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build repo-audit
        run: go build ./cmd/repo-audit

      - name: Build release-checker
        run: go build ./cmd/release-checker

      - name: Build codex-status
        run: go build ./cmd/codex-status

      - name: Build artifact-verify
        run: go build ./cmd/artifact-verify
